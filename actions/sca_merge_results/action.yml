name: Merge SCA scan results
description: Merge the per-target results of an SCA scheduled scan into one report (summary.md, report.json)

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the per-scanner scan parts (<scanner>/<id>.json, <scanner>/<id>.status.json with the ignorefile field of a source target, optional trivy/<id>.trivyignore (the .trivyignore of a source target), optional <scanner>/<id>.txt, optional trivy/<id>.gradle-graph/ with the Gradle dependency graph of a source target; trivy and osv)
    required: true
  output-dir:
    description: Directory to write the report into (summary.md, report.json, _native/<scanner>/)
    required: true
  trivy-db-info:
    description: 'JSON object {"vulnerability_db_updated_at": ..., "java_db_updated_at": ...} describing the Trivy DB snapshot of the run; empty means unknown'
    default: ""
  engine-ref:
    description: "Ref of the engine to state in the report (top-level `engine`); empty means the ref the action runs from"
    default: ""

outputs:
  failed-count:
    description: Number of targets whose scan failed (the workflow decides whether to fail the run)
    value: ${{ steps.report.outputs.failed-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    # the GitHub values the commands cannot read themselves: the host and the ref this action runs from
    - name: Resolve the run context
      id: context
      shell: bash
      env:
        ENGINE_REF_INPUT: ${{ inputs.engine-ref }}
        SERVER_URL: ${{ github.server_url }}
        ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python -m _sca_lib.github context
    - name: Merge scan results
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # the shared code of the SCA actions: actions/_sca_lib, a sibling of this directory
        PYTHONPATH: ${{ github.action_path }}/..:${{ github.action_path }}/../sca_rules
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        TRIVY_DB_INFO: ${{ inputs.trivy-db-info }}
        # the run context of the engine commands (SCA_RUN_*): the GitHub values
        SCA_RUN_HOST: ${{ steps.context.outputs.host }}
        SCA_RUN_REPO: ${{ github.repository }}
        SCA_RUN_ID: ${{ github.run_id }}
        SCA_RUN_ATTEMPT: ${{ github.run_attempt }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCA_RUN_EVENT: ${{ github.event_name }}
        SCA_RUN_ACTOR: ${{ github.triggering_actor }}
        SCA_RUN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SCA_RUN_ENGINE_REF: ${{ steps.context.outputs.engine-ref }}
      run: |
        python "$ACTION_PATH/merge_results.py" \
          --targets-file "$TARGETS_FILE" \
          --parts-dir "$PARTS_DIR" \
          --output-dir "$OUTPUT_DIR" \
          --trivy-db-info "$TRIVY_DB_INFO"
    # shows what the command wrote into its output directory: step outputs, job summary, annotations
    - name: Report the results
      id: report
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python -m _sca_lib.github render "$OUTPUT_DIR"
