name: Resolve SCA scan targets
description: Resolve the default-branch snapshot, the sources of the release set (the last N minor release lines and the newest release candidate) and the container images (development and the release tags) that an SCA scheduled scan should cover

inputs:
  repository:
    description: Repository (owner/name) whose code is scanned and whose releases are resolved
    required: true
  registry:
    description: Container registry the images are pulled from
    default: ghcr.io
  images:
    description: Image names without registry, one per line (e.g. epam/ai-dial-chat). Empty means source scan only
    default: ""
  osv-image-scan:
    description: Whether the OSV targets of image kinds run the direct OSV image scan (osv-scanner scan image); turn off for an image too large for the runner disk. The OSV BOM query always runs. Pass the repository's own setting; a manual run forces the scan with force-image-scan
    default: "true"
  force-image-scan:
    description: Run the direct OSV image scan although osv-image-scan is off for the repository (a manual run); the run is then marked forced_image_scan in targets.json and in the report
    default: "false"
  release-lines:
    description: How many newest minor release lines are scanned (one latest patch each), plus the newest release candidate if any
    default: "2"
  scan-tag:
    description: Focus the run on this one git tag - its source and the tag itself in every image - instead of the release set
    default: ""
  github-token:
    description: Token for the GitHub API and for authenticating to ghcr.io
    default: ${{ github.token }}
  output-dir:
    description: Directory where targets.json is written
    default: ${{ runner.temp }}/sca

outputs:
  matrix:
    description: Compact JSON array of the pending Trivy targets (may be "[]")
    value: ${{ steps.report.outputs.matrix }}
  targets-file:
    description: Path to targets.json with all targets and their statuses
    value: ${{ steps.report.outputs.targets-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    # gh (GitHub API) is on the runner image; oras lists the tags of the images
    # A composite action cannot use a sibling action by a relative path (it resolves in the workspace of the caller),
    # so the commands of the sca_tools action are run directly. Their own output directories are under runner.temp,
    # never the output-dir of this action
    - name: Resolve the tools cache key
      id: tools-key
      shell: bash
      env:
        # the engine package sca, from the src layout of the action checkout
        PYTHONPATH: ${{ github.action_path }}/../../src
        OUT: ${{ runner.temp }}/sca-tools-key-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # -P keeps the checked-out workspace off sys.path: it must not shadow the engine
        rm -rf "$OUT"
        args=(--tools oras --output-dir "$OUT")
        python -P -m sca tools key "${args[@]}"
        python "$ACTION_PATH/../_github/github_adapter.py" render "$OUT"
    # The installer verifies every cached download against the pinned sha256 on every run and downloads it again on a
    # mismatch, so a poisoned cache is harmless.
    - name: Cache the tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sca-tools
        key: ${{ steps.tools-key.outputs.key }}
    - name: Install oras
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../src
        TOOLS_DIR: ${{ runner.temp }}/sca-tools
        OUT: ${{ runner.temp }}/sca-tools-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        rm -rf "$OUT"
        args=(--tools oras --dir "$TOOLS_DIR" --output-dir "$OUT")
        python -P -m sca tools install "${args[@]}"
        python "$ACTION_PATH/../_github/github_adapter.py" path "$TOOLS_DIR"
    # the GitHub values the commands cannot read themselves: the host and the ref this action runs from
    - name: Resolve the run context
      id: context
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/../_github/github_adapter.py" context
    - name: Resolve targets
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        REGISTRY: ${{ inputs.registry }}
        IMAGES: ${{ inputs.images }}
        IMAGE_SCAN: ${{ inputs.osv-image-scan }}
        FORCE_IMAGE_SCAN: ${{ inputs.force-image-scan }}
        RELEASE_LINES: ${{ inputs.release-lines }}
        SCAN_TAG: ${{ inputs.scan-tag }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        # the run context of the engine commands (SCA_RUN_*): the GitHub values
        SCA_RUN_HOST: ${{ steps.context.outputs.host }}
        SCA_RUN_REPO: ${{ github.repository }}
        SCA_RUN_ID: ${{ github.run_id }}
        SCA_RUN_ATTEMPT: ${{ github.run_attempt }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SCA_RUN_EVENT: ${{ github.event_name }}
        SCA_RUN_ACTOR: ${{ github.triggering_actor }}
        SCA_RUN_ENGINE_REF: ${{ steps.context.outputs.engine-ref }}
        # the engine package sca, from the src layout of the action checkout
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: |
        # -P keeps the checked-out workspace off sys.path: it must not shadow the engine
        rm -f "$OUTPUT_DIR/outputs.json" "$OUTPUT_DIR/annotations.json" "$OUTPUT_DIR/summary.md"
        python -P -m sca targets \
          --repository "$REPOSITORY" \
          --registry "$REGISTRY" \
          --images "$IMAGES" \
          --osv-image-scan "$IMAGE_SCAN" \
          --force-image-scan "$FORCE_IMAGE_SCAN" \
          --release-lines "$RELEASE_LINES" \
          --scan-tag "$SCAN_TAG" \
          --output-dir "$OUTPUT_DIR"
    # shows what the command wrote into its output directory: step outputs, job summary, annotations
    - name: Report the results
      id: report
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/../_github/github_adapter.py" render "$OUTPUT_DIR"
