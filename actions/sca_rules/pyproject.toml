[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sca-rules"
dynamic = ["version"]
description = "The rules the SCA scan engine and the fix planner share: package key, version order, upgrade target, fixed-in-development state"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["sca_rules"]

[tool.setuptools.dynamic]
version = { attr = "sca_rules.__version__" }
