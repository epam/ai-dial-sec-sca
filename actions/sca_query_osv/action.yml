name: Query OSV for SCA scan packages
description: Check the packages found by Trivy in the targets of an SCA scheduled scan against OSV (osv.dev) with osv-scanner; for image targets also a direct OSV image scan, which queries OSV about the OS packages of the image too

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the Trivy scan parts (trivy/<id>.json and trivy/<id>.status.json of every Trivy target)
    required: true
  output-dir:
    description: Directory to write the OSV parts into (osv/<id>.json and osv/<id>.status.json of every OSV target)
    required: true
  trivy-version:
    description: Trivy version to use for converting the Trivy results to a BOM (release tag, e.g. v0.75.0)
    required: true
  trivy-sha256:
    description: sha256 of the Trivy release archive for this runner's architecture; needed only for a trivy-version without a pinned value in the engine
    default: ""
  offline-db-dir:
    description: Directory with the osv-scanner offline databases, downloaded by the caller beforehand; given, both scans run offline (no network) against it. Empty means online
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    # A composite action cannot use a sibling action by a relative path (it resolves in the workspace of the caller),
    # so the commands of the sca_tools action are run directly. Their own output directories are under runner.temp,
    # never the output-dir of this action
    - name: Resolve the tools cache key
      id: tools-key
      shell: bash
      env:
        # the engine package sca, from the src layout of the action checkout
        PYTHONPATH: ${{ github.action_path }}/../../src
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
        OUT: ${{ runner.temp }}/sca-tools-key-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # -P keeps the checked-out workspace off sys.path: it must not shadow the engine
        rm -rf "$OUT"
        args=(--tools trivy,osv-scanner --output-dir "$OUT")
        args+=(--trivy-version "$TRIVY_VERSION")
        if [ -n "$TRIVY_SHA256" ]; then
          args+=(--trivy-sha256 "$TRIVY_SHA256")
        fi
        python -P -m sca tools key "${args[@]}"
        python "$ACTION_PATH/../_github/github_adapter.py" render "$OUT"
    # The installer verifies every cached download against the pinned sha256 on every run and downloads it again on a
    # mismatch, so a poisoned cache is harmless.
    - name: Cache the tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/sca-tools
        key: ${{ steps.tools-key.outputs.key }}
    - name: Install Trivy and osv-scanner
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/../../src
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
        TOOLS_DIR: ${{ runner.temp }}/sca-tools
        OUT: ${{ runner.temp }}/sca-tools-out
        ACTION_PATH: ${{ github.action_path }}
      run: |
        rm -rf "$OUT"
        args=(--tools trivy,osv-scanner --dir "$TOOLS_DIR" --output-dir "$OUT")
        args+=(--trivy-version "$TRIVY_VERSION")
        if [ -n "$TRIVY_SHA256" ]; then
          args+=(--trivy-sha256 "$TRIVY_SHA256")
        fi
        python -P -m sca tools install "${args[@]}"
        python "$ACTION_PATH/../_github/github_adapter.py" path "$TOOLS_DIR"
    # the GitHub values the commands cannot read themselves: the host and the ref this action runs from
    - name: Resolve the run context
      id: context
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/../_github/github_adapter.py" context
    - name: Query OSV
      shell: bash
      env:
        SCA_RUN_ENGINE_REF: ${{ steps.context.outputs.engine-ref }}
        # the engine package sca, from the src layout of the action checkout
        PYTHONPATH: ${{ github.action_path }}/../../src
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OFFLINE_DB_DIR: ${{ inputs.offline-db-dir }}
      run: |
        # -P keeps the checked-out workspace off sys.path: it must not shadow the engine
        rm -f "$OUTPUT_DIR/outputs.json" "$OUTPUT_DIR/annotations.json" "$OUTPUT_DIR/summary.md"
        args=(
          --targets-file "$TARGETS_FILE"
          --parts-dir "$PARTS_DIR"
          --output-dir "$OUTPUT_DIR"
        )
        if [ -n "$OFFLINE_DB_DIR" ]; then
          args+=(--offline-db-dir "$OFFLINE_DB_DIR")
        fi
        python -P -m sca osv "${args[@]}"
    # shows what the command wrote into its output directory: step outputs, job summary, annotations
    - name: Report the results
      id: report
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ACTION_PATH: ${{ github.action_path }}
      run: python "$ACTION_PATH/../_github/github_adapter.py" render "$OUTPUT_DIR"
