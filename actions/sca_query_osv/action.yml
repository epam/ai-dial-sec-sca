name: Query OSV for SCA scan packages
description: Check the packages found by Trivy in the targets of an SCA scheduled scan against OSV (osv.dev) with osv-scanner; for image targets also a direct OSV image scan, which queries OSV about the OS packages of the image too

inputs:
  targets-file:
    description: Path to targets.json produced by the sca_resolve_targets action
    required: true
  parts-dir:
    description: Directory with the Trivy scan parts (trivy/<id>.json and trivy/<id>.status.json of every Trivy target)
    required: true
  output-dir:
    description: Directory to write the OSV parts into (osv/<id>.json and osv/<id>.status.json of every OSV target)
    required: true
  trivy-version:
    description: Trivy version to use for converting the Trivy results to a BOM (release tag, e.g. v0.75.0)
    required: true
  trivy-sha256:
    description: sha256 of the Trivy release archive for this runner's architecture; needed only for a trivy-version without a pinned value in the engine
    default: ""
  offline-db-dir:
    description: Directory with the osv-scanner offline databases, downloaded by the caller beforehand; given, both scans run offline (no network) against it. Empty means online
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    # A composite action cannot use a sibling action by a relative path (it resolves in the workspace of the caller),
    # so the steps of actions/_install_trivy are repeated here and share its install.sh
    - name: Resolve the Trivy tool directory
      id: trivy-dir
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        bash "$ACTION_PATH/../_install_trivy/install.sh" check "$TRIVY_VERSION"
        echo "path=$RUNNER_TOOL_CACHE/sca-trivy/$TRIVY_VERSION" >> "$GITHUB_OUTPUT"
        echo "key=sca-trivy-$TRIVY_VERSION-$RUNNER_OS-$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - name: Cache Trivy
      id: trivy-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.trivy-dir.outputs.path }}
        key: ${{ steps.trivy-dir.outputs.key }}
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
        TRIVY_DIR: ${{ steps.trivy-dir.outputs.path }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/../_install_trivy/install.sh" "$TRIVY_VERSION" "$TRIVY_DIR"
    - name: Add Trivy to PATH
      shell: bash
      env:
        TRIVY_DIR: ${{ steps.trivy-dir.outputs.path }}
      run: |
        echo "$TRIVY_DIR" >> "$GITHUB_PATH"
        "$TRIVY_DIR/trivy" --version
    # The checksums are pinned here, not read from the release: a replaced release must not pass
    - name: Install osv-scanner
      shell: bash
      env:
        OSV_SCANNER_VERSION: v2.7.0
        SHA256_AMD64: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        SHA256_ARM64: 4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
      run: |
        case "$(uname -m)" in
          x86_64) arch=amd64; sha256="$SHA256_AMD64" ;;
          aarch64 | arm64) arch=arm64; sha256="$SHA256_ARM64" ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/osv-scanner"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$RUNNER_TEMP/osv-scanner/osv-scanner" \
          "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_$arch"
        echo "$sha256  $RUNNER_TEMP/osv-scanner/osv-scanner" | sha256sum --check -
        chmod +x "$RUNNER_TEMP/osv-scanner/osv-scanner"
        echo "$RUNNER_TEMP/osv-scanner" >> "$GITHUB_PATH"
    - name: Query OSV
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # the shared code of the SCA actions: actions/_sca_lib, a sibling of this directory
        PYTHONPATH: ${{ github.action_path }}/..
        TARGETS_FILE: ${{ inputs.targets-file }}
        PARTS_DIR: ${{ inputs.parts-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        OFFLINE_DB_DIR: ${{ inputs.offline-db-dir }}
      run: |
        args=(
          --targets-file "$TARGETS_FILE"
          --parts-dir "$PARTS_DIR"
          --output-dir "$OUTPUT_DIR"
        )
        if [ -n "$OFFLINE_DB_DIR" ]; then
          args+=(--offline-db-dir "$OFFLINE_DB_DIR")
        fi
        python "$ACTION_PATH/query_osv.py" "${args[@]}"
