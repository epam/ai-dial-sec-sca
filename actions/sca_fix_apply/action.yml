name: Apply SCA fixes
description: Apply the automated items of one release line of a fix plan (Dependabot jobs, base image bump), prove them with a rescan by the detector of the scan (Trivy and OSV, one database state) and deliver them as one pull request (see fix_apply.py)

inputs:
  command:
    description: "apply, publish, node or summary"
    required: true
  plan:
    description: Path of fix-plan.json (apply, publish, summary)
    default: ""
  branch:
    description: Release branch of the plan line (apply, publish)
    default: ""
  tree:
    description: Checked-out working tree of the branch (apply, publish)
    default: "."
  repo:
    description: Repository (owner/name) the pull request is opened in (apply, publish)
    default: ${{ github.repository }}
  output-dir:
    description: Directory for result.json and pr-body.md (apply, publish)
    default: ""
  results-dir:
    description: Directory with the result.json files of the lines (summary)
    default: ""
  dependabot:
    description: Path of the Dependabot CLI binary (apply)
    default: ""
  updater-images:
    description: "JSON object: package manager -> updater image reference (apply)"
    default: "{}"
  proxy-image:
    description: Dependabot proxy image reference (apply)
    default: ""
  lockfile-command:
    description: Shell command that writes the Gradle lockfiles into the tree it runs in (apply, Gradle repositories)
    default: ""
  docker-build-args:
    description: Docker build arguments for the image rescan, newline-separated (apply)
    default: ""
  dependabot-timeout-minutes:
    description: Time limit of one Dependabot job in minutes; a timeout counts as "Dependabot could not" and an npm item goes on to the override step (apply)
    default: "8"
  dry-run:
    description: Do everything except the push and the pull request (publish)
    default: "false"
  token-kind:
    description: "Which token the input token is: workflow (the default workflow token), token (a token given by the caller) or app (a GitHub App installation token); the summary warns about the pull request workflows only for workflow (publish)"
    default: workflow
  git-user-name:
    description: Name of the fixer identity, author and committer of the fix commit (publish)
    default: github-actions[bot]
  git-user-email:
    description: Email of the fixer identity (publish)
    default: 41898282+github-actions[bot]@users.noreply.github.com
  token:
    description: Token for the Dependabot git source, the push and the pull request
    default: ${{ github.token }}
  ci-token:
    description: Token that reads the workflow runs and commit statuses of the baseline CI (apply); a GitHub App token does not have the permissions, the workflow token with actions and statuses read does
    default: ${{ github.token }}
  missing-branches:
    description: JSON list of the release branches of the plan that do not exist in the repository (summary)
    default: "[]"

outputs:
  version:
    description: Node version of the branch, empty when none is found (node)
    value: ${{ steps.run.outputs.version }}
  source:
    description: Where the node version was found (node)
    value: ${{ steps.run.outputs.source }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Run ${{ inputs.command }}
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        # the scan engine the detector reuses (normalize, vulns, query_osv) and its shared package _sca_lib
        PYTHONPATH: ${{ github.action_path }}/..:${{ github.action_path }}/../sca_merge_results:${{ github.action_path }}/../sca_query_osv
        COMMAND: ${{ inputs.command }}
        PLAN: ${{ inputs.plan }}
        BRANCH: ${{ inputs.branch }}
        TREE: ${{ inputs.tree }}
        REPO: ${{ inputs.repo }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        RESULTS_DIR: ${{ inputs.results-dir }}
        DEPENDABOT: ${{ inputs.dependabot }}
        UPDATER_IMAGES: ${{ inputs.updater-images }}
        PROXY_IMAGE: ${{ inputs.proxy-image }}
        LOCKFILE_COMMAND: ${{ inputs.lockfile-command }}
        DOCKER_BUILD_ARGS: ${{ inputs.docker-build-args }}
        DEPENDABOT_TIMEOUT_MINUTES: ${{ inputs.dependabot-timeout-minutes }}
        DRY_RUN: ${{ inputs.dry-run }}
        TOKEN_KIND: ${{ inputs.token-kind }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        GH_TOKEN: ${{ inputs.token }}
        BASELINE_CI_TOKEN: ${{ inputs.ci-token }}
        MISSING_BRANCHES: ${{ inputs.missing-branches }}
      run: |
        args=("$COMMAND" --plan "$PLAN")
        case "$COMMAND" in
          apply)
            args+=(--branch "$BRANCH" --tree "$TREE" --repo "$REPO" --output-dir "$OUTPUT_DIR"
              --dependabot "$DEPENDABOT" --updater-images "$UPDATER_IMAGES" --proxy-image "$PROXY_IMAGE"
              --lockfile-command "$LOCKFILE_COMMAND" --dependabot-timeout-minutes "$DEPENDABOT_TIMEOUT_MINUTES")
            while IFS= read -r arg; do
              [ -n "$arg" ] && args+=(--docker-build-arg "$arg")
            done <<< "$DOCKER_BUILD_ARGS"
            ;;
          publish)
            args+=(--branch "$BRANCH" --tree "$TREE" --repo "$REPO" --output-dir "$OUTPUT_DIR")
            args+=(--token-kind "$TOKEN_KIND" --git-user-name "$GIT_USER_NAME" --git-user-email "$GIT_USER_EMAIL")
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            ;;
          node)
            args=(node --tree "$TREE")
            ;;
          summary)
            args+=(--results-dir "$RESULTS_DIR" --missing-branches "$MISSING_BRANCHES")
            ;;
        esac
        python "$ACTION_PATH/fix_apply.py" "${args[@]}"
