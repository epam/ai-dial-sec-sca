name: Plan SCA fixes
description: Plan the fixes of the vulnerable packages of the newest release lines from schema 4 report.json files (fix-plan.json, fix-plan.md)

inputs:
  reports:
    description: Newline-separated paths of schema 4 report.json files of one repo (their versions are merged by ref; one of them has the development version)
    required: true
  config:
    description: 'JSON object with the policy, every key optional (severities, severities-previous, fixable-only, include-dev, release-branch, release-lines, include-candidate, methods, allow-major); defaults: methods dependabot,npm-override (docker-tag is opt-in, os items are manual: rebuild the image), allow-major none (dev-proven is opt-in; a target in another major is manual)'
    default: "{}"
  output-dir:
    description: Directory to write the plan into (fix-plan.json, fix-plan.md)
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    # the GitHub values the commands cannot read themselves: the host and the ref this action runs from
    - name: Resolve the run context
      id: context
      shell: bash
      env:
        SERVER_URL: ${{ github.server_url }}
        ACTION_PATH: ${{ github.action_path }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python -m _sca_lib.github context
    - name: Plan the fixes
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPORTS: ${{ inputs.reports }}
        CONFIG: ${{ inputs.config }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SCA_RUN_ENGINE_REF: ${{ steps.context.outputs.engine-ref }}
      run: |
        mapfile -t reports < <(printf '%s\n' "$REPORTS" | sed '/^[[:space:]]*$/d')
        PYTHONPATH="$ACTION_PATH:$ACTION_PATH/..:$ACTION_PATH/../sca_rules" python -m sca_fix_plan --reports "${reports[@]}" --config "$CONFIG" --output-dir "$OUTPUT_DIR"
    # shows what the command wrote into its output directory: step outputs, job summary, annotations
    - name: Report the results
      id: report
      if: always()
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        SCA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PYTHONPATH: ${{ github.action_path }}/..
      run: python -m _sca_lib.github render "$OUTPUT_DIR"
