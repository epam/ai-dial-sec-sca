name: Generate Gradle lockfiles
description: Resolve all dependencies of a Gradle build and write them to gradle.lockfile files, together with the resolved dependency graph of every project as JSON files (build files are not modified), so that dependency scanners such as Trivy can scan them and trace findings to the dependencies that brought them in. Runs Gradle on the JDK that its wrapper version supports (sca java); requires the Temurin JDKs 11, 17, 21 and 25 installed beforehand (JAVA_HOME_<version>_X64 or _ARM64 set, as by actions/setup-java)
inputs:
  working-directory:
    description: Directory of the Gradle build (where gradlew is located)
    default: "."
  gpr-username:
    description: GitHub Package Registry username (for pulling packages the build depends on)
    default: ${{ github.actor }}
  gpr-password:
    description: GitHub Package Registry password/token (for pulling packages the build depends on)
    default: ""
  graph-dir:
    description: Directory to write the dependency graph files (graph-<project path>.json, one per Gradle project) to. Must be empty or missing and, to stay out of scanners' way, outside the scanned directory. Defaults to gradle-graph under runner.temp
    default: ""
outputs:
  lockfiles:
    description: Number of generated gradle.lockfile files
    value: ${{ steps.generate.outputs.lockfiles }}
  graph-dir:
    description: Directory with the dependency graph files (one JSON file per Gradle project, see src/sca/gradle/lockfiles.init.gradle for the format)
    value: ${{ steps.generate.outputs.graph-dir }}

runs:
  using: "composite"
  steps:
    - name: Generate lockfiles
      id: generate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GPR_USERNAME: ${{ inputs.gpr-username }}
        GPR_PASSWORD: ${{ inputs.gpr-password }}
        GRAPH_DIR: ${{ inputs.graph-dir || format('{0}/gradle-graph', runner.temp) }}
        PYTHONPATH: ${{ github.action_path }}/../../src
      run: |
        # The graph files of an earlier run would be mixed up with the new ones
        if [ -d "$GRAPH_DIR" ] && [ -n "$(ls -A "$GRAPH_DIR")" ]; then
          echo "::error::Graph directory $GRAPH_DIR is not empty"
          exit 1
        fi
        mkdir -p "$GRAPH_DIR"
        # The JDK that the wrapper Gradle runs on; the JDK set stays detectable for toolchains
        choice=$(python -P -m sca java . --setup) || { echo "::error::$(printf '%s' "$choice" | jq -r .reason)"; exit 1; }
        printf '%s' "$choice" | jq -r .reason
        export JAVA_HOME=$(printf '%s' "$choice" | jq -r .java_home)
        export PATH="$JAVA_HOME/bin:$PATH"
        # 3 attempts with pauses of 30 s and 90 s, only when the log shows a repository outage or rate limit (429, 5xx, timeout)
        log=$(mktemp)
        for pause in 30 90 0; do
          rm -f "$GRAPH_DIR"/*.json
          ./gradlew --no-daemon --init-script "$GITHUB_ACTION_PATH/../../src/sca/gradle/lockfiles.init.gradle" -Pai.dial.sca.graphDir="$GRAPH_DIR" resolveAndLockAllConfigurations --write-locks 2>&1 | tee "$log"
          [ "${PIPESTATUS[0]}" -eq 0 ] && break
          if [ "$pause" -eq 0 ] || ! grep -qE 'status code (429|5[0-9][0-9])|Could not GET|Read timed out|Connect timed out|Connection reset|Remote host terminated' "$log"; then
            echo "::error::Gradle failed to resolve dependencies"; exit 1
          fi
          echo "Gradle: network failure, retry in $pause s" >&2
          sleep "$pause"
        done
        count=$(find . -name gradle.lockfile -type f | wc -l)
        echo "Generated lockfiles: $count"
        if [ "$count" -eq 0 ]; then
          echo "::error::No gradle.lockfile files were generated"
          exit 1
        fi
        graphs=$(find "$GRAPH_DIR" -name '*.json' -type f | wc -l)
        echo "Generated dependency graphs: $graphs"
        if [ "$graphs" -eq 0 ]; then
          echo "::error::No dependency graph files were generated"
          exit 1
        fi
        {
          echo "lockfiles=$count"
          echo "graph-dir=$GRAPH_DIR"
        } >> "$GITHUB_OUTPUT"
