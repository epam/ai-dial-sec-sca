name: SCA actions tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install -e . pytest jsonschema
      - name: Run tests
        run: python -m pytest test/sca
      - name: Run fix planner tests
        run: python -m pytest test/fix_plan
      - name: Run fix applier tests
        run: python -m pytest test/fix_apply

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tools
        uses: ./actions/sca_tools
      - name: Check the installed versions
        run: |
          trivy --version
          osv-scanner --version
          oras version
          crane version

  query-osv-install:
    # runs the install steps of sca_query_osv as a caller uses them (no targets: nothing is scanned)
    runs-on: ubuntu-24.04
    env:
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare an empty target list
        run: |
          mkdir -p "$RUNNER_TEMP/parts"
          echo '{"targets": []}' > "$RUNNER_TEMP/targets.json"
      - name: Run sca_query_osv
        uses: ./actions/sca_query_osv
        with:
          targets-file: ${{ runner.temp }}/targets.json
          parts-dir: ${{ runner.temp }}/parts
          output-dir: ${{ runner.temp }}/out
          trivy-version: ${{ env.TRIVY_VERSION }}
      - name: Check the installed versions
        run: |
          trivy --version | grep -F "Version: ${TRIVY_VERSION#v}"
          osv-scanner --version
